<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tag_tittle }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'projects/style.css' %}">
</head>

<body>

    <div id="container">

        <header>
            <a href="{% url 'home' %}">
                <h1>Projects</h1>
            </a>
        </header>

        <nav>
            <a href="{% url 'home' %}">Início</a>

            {% if user.is_authenticated %}
            Olá, <a href="{% url 'profile' %}" title="Ver/editar perfil de {{ user.username}}">{{ user.username }}</a>!
            |
            <form method="POST" action="{% url 'logout' %}" style="display: incline;">
                {% csrf_token %}
                <button type="submit">Sair</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}">Entrar</a>
            {% endif %}
        </nav>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <div>&copy; 2026 {{ site_name }}</div>
        </footer>


    </div>

</body>

</html>
